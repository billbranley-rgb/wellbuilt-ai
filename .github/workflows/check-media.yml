name: check-media

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate video/media references and Command Center links
        run: node scripts/check-media.mjs
